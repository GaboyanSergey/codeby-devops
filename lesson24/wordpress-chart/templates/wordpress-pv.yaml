apiVersion: v1
kind: PersistentVolume
metadata:
  name: wordpress-pv
  labels:
    {{- include "wordpress-chart.labels" . | nindent 4 }}
spec:
  capacity:
    storage: {{ .Values.wordpress.storage.size }}
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ .Values.wordpress.storage.storageClassName }}
  hostPath:
    path: /mnt/data/wordpress
    type: DirectoryOrCreate
