namespace: dev

mysql:
  image: mysql:8.0
  replicas: 1
  storage:
    size: 1Gi
    storageClassName: standard
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  secret:
    rootPassword: rootpass
    database: wordpress
    user: wpuser
    password: wppass

wordpress:
  image: wordpress:latest
  replicas: 1
  storage:
    size: 1Gi
    storageClassName: standard
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: NodePort
    port: 80
    nodePort: 30080

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50

ingress:
  enabled: true
  host: wordpress.local
  path: /
  pathType: Prefix

networkPolicy:
  enabled: true
