apiVersion: v1
kind: Pod
metadata:
  name: diagnostic-pod
  namespace: dev
spec:
  serviceAccountName: diagnostic-sa
  restartPolicy: Never
  containers:
  - name: diagnostic
    image: bitnami/kubectl:latest
    command:
    - sh
    - -c
    - |
      echo "All pods in namespace dev"
      kubectl get pods -n dev
      echo ""
      echo "WordPress pods only"
      kubectl get pods -n dev -l app=wordpress
      echo ""
      echo "Done"
