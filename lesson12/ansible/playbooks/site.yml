- name: Configure web servers in dev and prod environments
  hosts: all
  become: yes

  tasks:
    - name: Install required packages
      apt:
        name:
          - wget
          - htop
          - nginx
        state: present
        update_cache: yes

    - name: Ensure Nginx is running and enabled
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Show environment information
      debug:
        msg: "This host is in {{ env_name }} environment"
