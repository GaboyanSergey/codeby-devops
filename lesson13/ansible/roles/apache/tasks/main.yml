- name: Install Apache (Debian/Ubuntu)
  apt:
    name: "{{ apache_packages_debian }}"
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: Install Apache (RedHat/CentOS)
  yum:
    name: "{{ apache_packages_redhat }}"
    state: present
  when: ansible_os_family == "RedHat"

- name: Ensure Apache is running and enabled (Debian/Ubuntu)
  service:
    name: apache2
    state: started
    enabled: yes
  when: ansible_os_family == "Debian"

- name: Ensure Apache is running and enabled (RedHat/CentOS)
  service:
    name: httpd
    state: started
    enabled: yes
  when: ansible_os_family == "RedHat"

- name: Deploy index.html
  template:
    src: index.html.j2
    dest: /var/www/html/index.html
  notify: Restart Apache
